name: Offline tests and report artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Standard library (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library regression and consistency checks
        run: make check

  reports:
    name: Required Chromium and Japanese PDF checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned browser-test tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/ci/requirements.txt
      - name: Install Chrome system libraries and Japanese PDF dependencies
        run: |
          python -m playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk poppler-utils unzip
          fc-cache -f
      - name: Install pinned official Chrome for Testing
        env:
          CHROME_VERSION: '154.0.8037.57'
        run: |
          browser_root="$RUNNER_TEMP/security-scan-chrome-$CHROME_VERSION"
          evidence="$RUNNER_TEMP/security-scan-report-artifacts/browser-install"
          mkdir -p "$browser_root" "$evidence"
          curl --fail --location --retry 3 --max-time 60 \
            "https://googlechromelabs.github.io/chrome-for-testing/$CHROME_VERSION.json" \
            --output "$evidence/manifest.json"
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          version = os.environ["CHROME_VERSION"]
          evidence = Path(os.environ["RUNNER_TEMP"]) / "security-scan-report-artifacts/browser-install"
          manifest = json.loads((evidence / "manifest.json").read_text())
          expected = f"https://storage.googleapis.com/chrome-for-testing-public/{version}/linux64/chrome-linux64.zip"
          urls = [item["url"] for item in manifest["downloads"]["chrome"] if item["platform"] == "linux64"]
          if manifest["version"] != version or urls != [expected]:
              raise SystemExit("Official Chrome manifest does not match the pinned Linux version")
          (evidence / "download-url.txt").write_text(expected + "\n")
          PYTHON
          curl --fail --location --retry 3 --max-time 180 \
            "$(cat "$evidence/download-url.txt")" --output "$browser_root/chrome-linux64.zip"
          sha256sum "$browser_root/chrome-linux64.zip" | tee "$evidence/archive-sha256.txt"
          unzip -q "$browser_root/chrome-linux64.zip" -d "$browser_root"
          export CHROME="$browser_root/chrome-linux64/chrome"
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import subprocess
          chrome = os.environ["CHROME"]
          version = subprocess.run([chrome, "--version"], capture_output=True, text=True, check=True, timeout=5).stdout.strip()
          print(version, flush=True)
          evidence = Path(os.environ["RUNNER_TEMP"]) / "security-scan-report-artifacts/browser-install"
          (evidence / "version.txt").write_text(version + "\n")
          match = re.fullmatch(r"(?:Google )?Chrome for Testing ([0-9.]+)", version)
          if not match or match.group(1) != os.environ["CHROME_VERSION"]:
              raise SystemExit("Downloaded Chrome version does not match the exact CI pin")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CHROME={chrome}\n")
          PYTHON
      - name: Require real browser and PDF tests with zero skips
        env:
          SECURITY_SCAN_REPORT_ARTIFACTS: ${{ runner.temp }}/security-scan-report-artifacts
        run: |
          python scripts/ci/check_chromium_pdf.py
          python scripts/ci/run_required_tests.py
      - name: Retain synthetic browser and PDF evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-report-evidence
          path: ${{ runner.temp }}/security-scan-report-artifacts/
          retention-days: 7
          if-no-files-found: error
