name: Offline tests and report artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Standard library (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library regression and consistency checks
        run: make check

  reports:
    name: Required Chromium and Japanese PDF checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned browser-test tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/ci/requirements.txt
      - name: Install Japanese fonts and PDF inspection tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            install --yes --no-install-recommends fonts-noto-cjk poppler-utils
          fc-cache -f
      - name: Verify the runner's exact Google Chrome distribution
        env:
          CHROME_VERSION: '154.0.8037.97'
        run: |
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          chrome = Path("/usr/bin/google-chrome")
          if not chrome.is_file():
              raise SystemExit("Required runner-provided Google Chrome is missing; no browser fallback is allowed")
          evidence = Path(os.environ["RUNNER_TEMP"]) / "security-scan-report-artifacts/browser-selection"
          evidence.mkdir(parents=True, exist_ok=True)
          version = subprocess.run([str(chrome), "--version"], capture_output=True, text=True, check=True, timeout=5).stdout.strip()
          package = subprocess.run(["dpkg-query", "-W", "-f=${Version}", "google-chrome-stable"], capture_output=True, text=True, check=True, timeout=5).stdout.strip()
          print(f"Browser: {version}\nPackage: google-chrome-stable {package}", flush=True)
          (evidence / "version.txt").write_text(version + "\n")
          (evidence / "package-version.txt").write_text("google-chrome-stable " + package + "\n")
          expected = os.environ["CHROME_VERSION"]
          if version != f"Google Chrome {expected}":
              raise SystemExit("Runner Chrome changed: revalidate the new image version before updating the explicit CI guard")
          wrapper = chrome.resolve(strict=True)
          files = subprocess.run(["dpkg-query", "-L", "google-chrome-stable"], capture_output=True, text=True, check=True, timeout=5).stdout.splitlines()
          binaries = [Path(path) for path in files if Path(path).name == "chrome" and Path(path).is_file()]
          if str(wrapper) not in files or len(binaries) != 1:
              raise SystemExit("The Google Chrome package wrapper/executable cannot be identified unambiguously")
          records = []
          for path in (wrapper, binaries[0]):
              digest = hashlib.sha256()
              with path.open("rb") as binary:
                  for block in iter(lambda: binary.read(1024 * 1024), b""):
                      digest.update(block)
              records.append(f"{digest.hexdigest()}  {path}")
          hashes = "\n".join(records) + "\n"
          print(hashes, end="", flush=True)
          (evidence / "sha256.txt").write_text(hashes)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CHROME={chrome}\n")
          PYTHON
      - name: Require real browser and PDF tests with zero skips
        env:
          SECURITY_SCAN_REPORT_ARTIFACTS: ${{ runner.temp }}/security-scan-report-artifacts
        run: |
          python scripts/ci/check_chromium_pdf.py
          python scripts/ci/run_required_tests.py
      - name: Retain synthetic browser and PDF evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-report-evidence
          path: ${{ runner.temp }}/security-scan-report-artifacts/
          retention-days: 7
          if-no-files-found: error
